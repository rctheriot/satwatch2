[preset.0]

name="Wall (Windows)"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Non-resource files Godot would otherwise leave out of the .pck. Without this
; the build runs on the dev machine and shows an empty globe on the wall: the
; ephemeris, catalog and every live-data snapshot are plain files, not Godot
; resources, so "all_resources" does not include them.
include_filter="data/*.bin,data/*.json,data/*.png,assets/*.jpg"
exclude_filter="data/gp_cache/*"
export_path="build/OrbitalDensityWall.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/modify_resources=true
application/product_name="Orbital Density Wall"
application/file_description="Stereoscopic satellite catalogue visualization"
application/company_name="University of Hawaii LAVA Lab"
